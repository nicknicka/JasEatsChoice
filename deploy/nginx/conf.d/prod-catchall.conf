# 覆盖 nginx 镜像自带的 /etc/nginx/conf.d/default.conf
#
# 镜像默认块是 `listen 80 default_server` + root /usr/share/nginx/html。
# 生产环境把 SPA 产物挂在同一个目录下，未匹配 server_name 的请求会绕过
# HTTPS 跳转直接拿到明文页面，所以这里改成直接断开连接。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
