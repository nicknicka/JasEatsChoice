# 反向代理通用参数：协议版本 + 转发头（在每个 location 内 include）
#
# 超时与缓冲不放在这里：数组型指令（proxy_set_header）不会跨层继承，必须逐 location 引入；
# 而同类标量指令在同一作用域内重复定义会让 nginx 直接启动失败，
# 所以可被 location 覆盖的超时值改在 server 级 include proxy-defaults.conf。
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 普通请求置空以复用 upstream keepalive；WebSocket 请求由 map 改为 upgrade
proxy_set_header Connection $connection_upgrade;
