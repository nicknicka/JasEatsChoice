name: jaseats

x-app-env: &app-env
  - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
  - SERVER_PORT=7777
  - NETTY_PORT=11277
  - DB_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jia_shi_yi_xuan}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
  - DB_USERNAME=${DB_USERNAME:?DB_USERNAME missing; run scripts/gen-env.sh}
  - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD missing; run scripts/gen-env.sh}
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - REDIS_PASSWORD=${REDIS_PASSWORD:-}
  - JWT_SECRET=${JWT_SECRET:?JWT_SECRET missing; run scripts/gen-env.sh}
  - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
  - AI_PROVIDER=${AI_PROVIDER:-zhipu}
  - AI_API_KEY=${AI_API_KEY:-}
  - AI_MODEL=${AI_MODEL:-glm-4-flash}
  - AI_SUPERVISOR_MODEL=${AI_SUPERVISOR_MODEL:-glm-4-flash}
  - AI_VISION_MODEL=${AI_VISION_MODEL:-glm-4.1v-thinking-flash}
  - AI_BASE_URL=${AI_BASE_URL:-}
  - AI_TIMEOUT=${AI_TIMEOUT:-30000}
  - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}
  - ANNOUNCEMENT_RAG_ENABLED=${ANNOUNCEMENT_RAG_ENABLED:-true}
  - QDRANT_HOST=qdrant
  - QDRANT_PORT=6334
  - QDRANT_COLLECTION=${QDRANT_COLLECTION:-jaseats_knowledge_v1}
  - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-embedding-3}
  - AI_EMBEDDING_DIMENSIONS=${AI_EMBEDDING_DIMENSIONS:-2048}
  - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL:-}
  - AMAP_API_KEY=${AMAP_API_KEY:-}
  - TENCENT_MAP_KEY=${TENCENT_MAP_KEY:-}
  - MAIL_USERNAME=${MAIL_USERNAME:-}
  - MAIL_PASSWORD=${MAIL_PASSWORD:-}
  - CAPTCHA_TEST_FIXED_CODE_ENABLED=${CAPTCHA_TEST_FIXED_CODE_ENABLED:-false}
  - CAPTCHA_TEST_FIXED_CODE=${CAPTCHA_TEST_FIXED_CODE:-}
  - FILE_UPLOAD_PATH=/data/uploads/
  - FILE_SERVER_URL=${FILE_SERVER_URL:-http://localhost/api}
  - WORKER_ID=${WORKER_ID:-1}
  - DATACENTER_ID=${DATACENTER_ID:-1}

services:
  mysql:
    image: mysql:9.4
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD missing; run scripts/gen-env.sh}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-jia_shi_yi_xuan}
      # The image creates this account on first init and grants it MYSQL_DATABASE
      # only. The app logs in with DB_USERNAME/DB_PASSWORD, so root stays a
      # separate admin credential rather than being reused as the app password.
      - MYSQL_USER=${DB_USERNAME:?DB_USERNAME missing; run scripts/gen-env.sh}
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD missing; run scripts/gen-env.sh}
    volumes:
      - mysql-data:/var/lib/mysql
      # Flyway 管理 schema 和种子数据，db/init 不再挂载到 initdb.d
      # - ../db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - jaseats-net
    healthcheck:
      # SELECT 1 as the *app* account, so a wrong DB_PASSWORD surfaces here instead
      # of only when Spring opens its pool (mysqladmin ping answers "alive" even when
      # authentication is refused). $$ defers expansion to the container's own shell,
      # which also keeps the password out of `docker inspect` Config.Healthcheck.Test.
      test: ["CMD-SHELL", "mysql -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.0
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - jaseats-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - jaseats-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  spring-boot:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - jaseats-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - uploads:/data/uploads:ro
    depends_on:
      spring-boot:
        condition: service_healthy
    networks:
      - jaseats-net
    healthcheck:
      # 127.0.0.1, not localhost: the config binds `listen 80` (IPv4 only) while
      # musl resolves localhost to ::1 first, so a localhost probe is refused even
      # when nginx is serving correctly.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  jaseats-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  uploads:
