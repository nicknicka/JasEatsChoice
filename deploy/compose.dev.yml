services:
  mysql:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  spring-boot:
    ports:
      - "7777:7777"
      - "11277:11277"
    environment:
      SPRING_PROFILES_ACTIVE: local
      FILE_SERVER_URL: http://localhost:7777/api
      CAPTCHA_TEST_FIXED_CODE_ENABLED: "true"
      CAPTCHA_TEST_FIXED_CODE: "8888"

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
