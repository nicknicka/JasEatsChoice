server:
  port: ${SERVER_PORT:7777}

# 本地开发用：数据库与 Redis 默认指向宿主机，凭据一律由环境变量提供，
# 不在文件里留任何可用密码。
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jia_shi_yi_xuan?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads/}
    server-url: ${FILE_SERVER_URL:http://localhost:7777/api}

zhipuai:
  api-key: ${ZHIPU_API_KEY:${ZHIPUAI_API_KEY:}}
  model: ${ZHIPU_MODEL:glm-4.7}
  # 本地预留 Ollama 配置位：当前代码尚未接入，先放这里方便后续切换
  ollama:
    enabled: false
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
    vision-model: ${OLLAMA_VISION_MODEL:llava:7b}
