name: regression

# 全量 138 条 Playwright 用例。每晚跑一次，也支持手动触发。
# 用例只断言页面可达与交互存在，不调用真实大模型，所以这个 job 不需要任何密钥。

on:
  schedule:
    - cron: '30 18 * * *' # 北京时间 02:30
  workflow_dispatch:
    inputs:
      keep_stack:
        description: '跑完保留容器栈（仅便于排查，会占用 runner 到超时）'
        required: false
        type: boolean
        default: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/client/package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        run: |
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm --prefix apps/client ci --ignore-scripts
          npm --prefix tests ci

      - name: Prepare env file
        run: bash scripts/gen-env.sh

      - name: Install Playwright browser
        run: cd tests && npx playwright install --with-deps chromium

      - name: Run all specs
        env:
          KEEP_STACK: ${{ inputs.keep_stack && '1' || '0' }}
        run: bash scripts/ci-e2e.sh all

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            tests/reports/html
            tests/reports/artifacts
            tests/reports/results.json
            tests/progress.txt
          retention-days: 14
          if-no-files-found: warn
