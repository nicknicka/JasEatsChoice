# ==================== AI助手配置文件 ====================
# 此文件集中管理AI助手相关的所有配置，避免硬编码

# 系统提示词配置
system:
  prompts:
    # 主系统提示词
    primary: |
      你是佳食宜选的智能饮食助手，可以帮助用户搜索菜品、查看订单、获取营养分析等。
      你的职责：
      1. 根据用户需求推荐合适的菜品
      2. 提供准确的营养信息和健康建议
      3. 协助用户完成下单和订单查询
      4. 保持友好、专业的服务态度
      请用简洁、自然的语言与用户交流。

    # 推荐专用提示词
    recommendation: |
      你是专业的菜品推荐顾问。根据用户的口味偏好、健康需求和预算，
      推荐最合适的菜品组合。请关注用户的饮食禁忌和过敏信息。

    # 营养分析专用提示词
    nutrition: |
      你是专业的营养分析师。提供准确的营养信息，包括热量、蛋白质、
      脂肪、碳水化合物等。对于有特殊饮食需求的用户，给出相应的建议。

# 菜品分类配置
categories:
  dishes:
    - name: 主食
      description: 米饭、面条、包子等主食类
      enabled: true
    - name: 菜肴
      description: 各类炒菜、凉菜等
      enabled: true
    - name: 汤品
      description: 各种汤类
      enabled: true
    - name: 饮品
      description: 饮料、果汁、奶茶等
      enabled: true
    - name: 小吃
      description: 小吃、零食类
      enabled: true
    - name: 甜点
      description: 甜品、糕点类
      enabled: true

# Function Calling 工具函数配置
tools:
  # 是否启用工具函数
  enabled: true

  # 工具函数列表
  functions:
    - name: search_dishes
      enabled: true
      description: 根据关键词或分类搜索菜品
      timeout: 5000  # 超时时间(毫秒)

    - name: get_dish_details
      enabled: true
      description: 获取指定菜品的详细信息
      timeout: 3000

    - name: create_order
      enabled: true
      description: 创建一个新的订单
      timeout: 10000

    - name: get_order_status
      enabled: true
      description: 查询订单的当前状态
      timeout: 3000

    - name: get_user_preferences
      enabled: true
      description: 获取用户的饮食偏好和历史记录
      timeout: 3000

    - name: analyze_nutrition
      enabled: true
      description: 分析食物的营养成分和热量
      timeout: 5000

# AI模型参数配置
model:
  # 温度参数 (0.0-2.0)，越低越确定性，越高越创造性
  temperature: 0.7
  # 最大token数
  max_tokens: 2000
  # Top-P采样参数
  top_p: 0.9
  # 惩罚重复
  frequency_penalty: 0.0
  presence_penalty: 0.0

# 营养分析配置
nutrition:
  # 数据源类型：database(数据库), api(第三方API), ai(AI估算)
  data-source: database
  # 默认份量(克)
  default-portion: 100
  # 是否启用详细营养分析
  detailed-analysis: true
  # 营养成分项
  components:
    - name: 热量
      unit: kcal
      enabled: true
    - name: 蛋白质
      unit: g
      enabled: true
    - name: 脂肪
      unit: g
      enabled: true
    - name: 碳水化合物
      unit: g
      enabled: true
    - name: 膳食纤维
      unit: g
      enabled: true
    - name: 钠
      unit: mg
      enabled: false

# 安全配置
security:
  # 敏感词过滤
  sensitive-word-filter: true
  # 输入最大长度
  max-input-length: 500
  # 输出最大长度
  max-output-length: 2000
  # 是否启用内容审核
  content-moderation: true
