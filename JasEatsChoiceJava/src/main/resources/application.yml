server:
  port: 8080
  servlet:
    context-path: /api
    # 强制请求和响应使用UTF-8编码
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

# ============ Lombok配置 ============
lombok:
  enabled: true  # 启用Lombok注解处理器

spring:
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 200MB  # 单个文件最大大小（支持视频上传）
      max-request-size: 220MB  # 单次请求最大大小
  # HTTP编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 数据库配置 - 使用utf8mb4字符集
  datasource:
    url: jdbc:mysql://localhost:3306/jia_shi_yi_xuan?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP连接池配置
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      # 数据库连接初始化SQL，确保使用UTF8MB4字符集
      data-source-properties:
        useUnicode: true
        characterEncoding: UTF-8

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      # Redis连接配置（使用lettuce）
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Jackson配置 - JSON序列化编码
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 确保JSON使用UTF-8编码
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    # 强制UTF-8编码
    charset: UTF-8
    # 禁止转义Unicode字符（让中文直接显示，而不是\uXXXX格式）
    parser:
      allow-unquoted-control-chars: true
    # 非严格JSON解析
    lenient: true
    # 使用驼峰命名策略（camelCase），与前端保持一致
    property-naming-strategy: LOWER_CAMEL_CASE

# Spring MVC配置
spring.mvc:
  # 强制响应编码为UTF-8
  format:
    date: yyyy-MM-dd HH:mm:ss
    time: HH:mm:ss
  # 设置静态资源编码
  staticpath-pattern: /**

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xx.jaseatschoicejava.entity
  type-handlers-package: com.xx.jaseatschoicejava.handler  # 注册类型处理器
  configuration:
    map-underscore-to-camel-case: true  # 自动驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开启 SQL 日志
  global-config:
    db-config:
      id-type: AUTO  # 主键自动递增
      table-underline: true  # 表名驼峰转下划线
      # 开启自动更新表结构
      # 如果表不存在则自动创建，如果字段不存在则自动添加，不会删除字段
      logic-delete-value: 1  # 逻辑删除值
      logic-not-delete-value: 0  # 逻辑未删除值

# JWT配置
jwt:
  secret: jia_shi_yi_xuan_secret_key_1234567890
  expiration: 86400000  # 24小时

# 文件上传配置
file:
  upload:
    path: /Users/nickxiao/JasEatsChoice/uploads/  # 文件上传保存路径
    url-prefix: /api/uploads/  # 访问URL前缀（相对路径）
    server-url: http://localhost:8080  # 服务器完整URL（用于构建完整访问地址）

# Netty配置
netty:
  port: 11277  # 更改为未被使用的端口号
  bossGroup:
    threads: 1
  workerGroup:
    threads: 8
  maxFrameLength: 65536  # 从application.properties同步的配置
  lengthFieldOffset: 0
  lengthFieldLength: 4
  lengthAdjustment: 0
  initialBytesToStrip: 4

# 高德地图API配置
amap:
  # API Key（用于前端 JavaScript API 和后端 Web 服务 API）
  api-key: 140e4ebfe143855a4cc7440533ff27b3
  # 是否启用后端代理模式
  proxy-enabled: true

gaode:
