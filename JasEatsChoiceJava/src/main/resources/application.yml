server:
  port: 7777
  servlet:
    context-path: /api
    # 强制请求和响应使用UTF-8编码
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

# ============ Lombok配置 ============
lombok:
  enabled: true  # 启用Lombok注解处理器

spring:
  # 关闭DevTools热重载，避免开发时中断正在执行的请求
  devtools:
    restart:
      enabled: false
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 200MB  # 单个文件最大大小（支持视频上传）
      max-request-size: 220MB  # 单次请求最大大小
  # HTTP编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 数据库配置 - 使用utf8mb4字符集
  datasource:
    url: jdbc:mysql://localhost:3306/jia_shi_yi_xuan?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP连接池配置
    hikari:
      maximum-pool-size: 20              # 最大连接数
      minimum-idle: 5                   # 最小空闲连接数
      connection-timeout: 30000         # 连接超时时间（30秒）
      idle-timeout: 600000               # 空闲连接超时（10分钟）
      max-lifetime: 1800000              # 连接最大生命周期（30分钟）
      connection-test-query: SELECT 1   # 连接测试查询（保活）
      validation-timeout: 5000           # 验证超时时间（5秒）
      leak-detection-threshold: 60000    # 连接泄漏检测（60秒）
      # 数据库连接初始化SQL，确保使用UTF8MB4字符集
      data-source-properties:
        useUnicode: true
        characterEncoding: UTF-8
        cachePrepStmts: true              # 缓存PreparedStatement
        prepStmtCacheSize: 250            #PreparedStatement缓存大小
        prepStmtCacheSqlLimit: 2048      # SQL长度限制

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      # Redis连接配置（使用lettuce）
      lettuce:
        pool:
          max-active: 16      # 最大连接数（优化后）
          max-idle: 8         # 最大空闲连接数
          min-idle: 2         # 最小空闲连接数（优化后）
          max-wait: 3000ms    # 最大等待时间（优化后）

  # Jackson配置 - JSON序列化编码
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 确保JSON使用UTF-8编码
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    # 强制UTF-8编码
    charset: UTF-8
    # 禁止转义Unicode字符（让中文直接显示，而不是\uXXXX格式）
    parser:
      allow-unquoted-control-chars: true
    # 非严格JSON解析
    lenient: true
    # 使用驼峰命名策略（camelCase），与前端保持一致
    property-naming-strategy: LOWER_CAMEL_CASE

# Spring MVC配置
spring.mvc:
  # 强制响应编码为UTF-8
  format:
    date: yyyy-MM-dd HH:mm:ss
    time: HH:mm:ss
  # 设置静态资源编码
  staticpath-pattern: /**
  # AI流式接口允许更长的异步处理时间，避免长对话在默认超时后被回收
  async:
    request-timeout: 300000

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xx.jaseatschoicejava.entity
  type-handlers-package: com.xx.jaseatschoicejava.handler  # 注册类型处理器
  configuration:
    map-underscore-to-camel-case: true  # 自动驼峰命名转换
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 关闭 SQL 日志输出
  global-config:
    db-config:
      id-type: AUTO  # 主键自动递增
      table-underline: true  # 表名驼峰转下划线
      # 开启自动更新表结构
      # 如果表不存在则自动创建，如果字段不存在则自动添加，不会删除字段
      logic-delete-value: 1  # 逻辑删除值
      logic-not-delete-value: 0  # 逻辑未删除值

# JWT配置
jwt:
  secret: jia_shi_yi_xuan_secret_key_1234567890
  expiration: 86400000  # 24小时

# 文件上传配置
file:
  upload:
    path: /Users/nickxiao/JasEatsChoice/uploads/  # 文件上传保存路径
    url-prefix: /uploads/  # 访问URL前缀（相对路径，注意不带/api前缀，因为会自动添加）
    server-url: http://192.168.137.188:7777/api  # 服务器完整URL（用于构建完整访问地址）

# Netty配置
netty:
  port: 11277  # 更改为未被使用的端口号
  bossGroup:
    threads: 1
  workerGroup:
    threads: 8
  maxFrameLength: 65536  # 从application.properties同步的配置
  lengthFieldOffset: 0
  lengthFieldLength: 4
  lengthAdjustment: 0
  initialBytesToStrip: 4

# 高德地图API配置
amap:
  # API Key（用于前端 JavaScript API 和后端 Web 服务 API）
  api-key: 140e4ebfe143855a4cc7440533ff27b3
  # 是否启用后端代理模式
  proxy-enabled: true

gaode:
  map:
    api:
      key: 140e4ebfe143855a4cc7440533ff27b3
      url: https://restapi.amap.com/v3
      weatherUrl: https://restapi.amap.com/v3/weather/weatherInfo


aliyun:
  sms:
    # 接入点地址（固定值，无需改）
    endpoint: dypnsapi.aliyuncs.com
    # 签名（从阿里云号码认证控制台→短信认证→签名管理获取）
    signName: 速通互联验证码
    # 模板CODE（从控制台→模板管理获取，如：SMS_XXXXXX）
    templateCode: 100001
    # 验证码有效期（可选，默认5分钟）
    codeExpireMinutes: 5
    # 模拟模式（true=只打印到控制台不真实发送，false=真实发送短信）
