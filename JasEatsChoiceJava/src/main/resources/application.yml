# ==================== Actuator监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        # 暴露的端点：health, info, metrics, cachestats（自定义）
        include: health,info,metrics,cachestats
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    # 启用cachestats端点
    cachestats:
      enabled: true
  # 启用Prometheus指标导出（可选）
  metrics:
    export:
      prometheus:
        enabled: false  # 如果需要Prometheus监控，设为true

# ==================== ChatMemory配置 ====================
chat:
  memory:
    ttl-hours: 2  # Redis消息过期时间（小时）
    max-messages: 20  # 最多保留的消息数量
