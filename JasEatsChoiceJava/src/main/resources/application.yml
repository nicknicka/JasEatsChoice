# ==================== ID生成器配置 ====================
# XOR雪花算法ID生成器配置
id:
  generator:
    worker-id: ${WORKER_ID:1}          # 机器ID（0-31），可通过环境变量覆盖
    datacenter-id: ${DATACENTER_ID:1}  # 数据中心ID（0-31），可通过环境变量覆盖
    epoch: 1704067200000                  # 纪元时间（2024-01-01 00:00:00 CST）

# ==================== 智谱AI配置 ====================
zhipuai:
  # API密钥（建议通过环境变量 ZHIPU_API_KEY 注入，兼容旧名 ZHIPUAI_API_KEY）
  api-key: ${ZHIPU_API_KEY:${ZHIPUAI_API_KEY:}}
  # 文本推理模型：GLM-4.7
  model: ${ZHIPU_MODEL:glm-4.7}
  # 视觉模型选择（用于菜品识别、图像理解）
  # glm-4.6v-flash: 支持视觉识别的免费模型（推荐用于菜品识别）
  vision-model: glm-4.6v-flash
  # API地址
  base-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  # 超时时间（毫秒）
  timeout: 30000

# ==================== 内容提取配置 ====================
content-extraction:
  fetch:
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    connect-timeout: 30000
    read-timeout: 60000
    max-images: 5
    max-image-size: 2097152       # 2MB
    max-video-size: 52428800      # 50MB
  retry:
    max-count: 3
    delay-ms: 5000
  ai:
    video-api-timeout: 120000     # 视频理解API超时（毫秒）

