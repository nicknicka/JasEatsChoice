  # SMTP服务器地址（根据邮箱服务商填写）
  # QQ邮箱: smtp.qq.com
  # 163邮箱: smtp.163.com
  # Gmail: smtp.gmail.com
  host: smtp.qq.com
  # SMTP端口（SSL加密通常使用465，TLS加密通常使用587）
