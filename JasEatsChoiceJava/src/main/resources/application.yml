server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB  # 单个文件最大大小
      max-request-size: 50MB  # 单次请求最大大小
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/jia_shi_yi_xuan?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xx.jaseatschoicejava.entity
  type-handlers-package: com.xx.jaseatschoicejava.handler  # 注册类型处理器
  configuration:
    map-underscore-to-camel-case: true  # 自动驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开启 SQL 日志
  global-config:
    db-config:
      id-type: AUTO  # 主键自动递增
      table-underline: true  # 表名驼峰转下划线
      # 开启自动更新表结构
      # 如果表不存在则自动创建，如果字段不存在则自动添加，不会删除字段
      logic-delete-value: 1  # 逻辑删除值
      logic-not-delete-value: 0  # 逻辑未删除值

# JWT配置
jwt:
  secret: jia_shi_yi_xuan_secret_key_1234567890
  expiration: 86400000  # 24小时

# 文件上传配置
file:
  upload:
    path: /Users/nickxiao/JasEatsChoice/uploads/  # 文件上传保存路径
    url-prefix: /api/uploads/  # 访问URL前缀（相对路径）
    server-url: http://localhost:8080  # 服务器完整URL（用于构建完整访问地址）

# Netty配置
netty:
  port: 11277  # 更改为未被使用的端口号
  bossGroup:
    threads: 1
  workerGroup:
    threads: 8
  maxFrameLength: 65536  # 从application.properties同步的配置
  lengthFieldOffset: 0
  lengthFieldLength: 4
  lengthAdjustment: 0
  initialBytesToStrip: 4

# 高德地图API配置
gaode:
  map:
    api:
      key: 140e4ebfe143855a4cc7440533ff27b3
      url: https://restapi.amap.com/v3
      weatherUrl: https://restapi.amap.com/v3/weather/weatherInfo


aliyun:
  sms:
    # 接入点地址（固定值，无需改）
    endpoint: dypnsapi.aliyuncs.com
    # 签名（从阿里云号码认证控制台→短信认证→签名管理获取）
    signName: 速通互联验证码
    # 模板CODE（从控制台→模板管理获取，如：SMS_XXXXXX）
    templateCode: 100001
    # 验证码有效期（可选，默认5分钟）
    codeExpireMinutes: 5

# ==================== ID生成器配置 ====================
# XOR雪花算法ID生成器配置
id:
  generator:
    worker-id: ${WORKER_ID:1}          # 机器ID（0-31），可通过环境变量覆盖
    datacenter-id: ${DATACENTER_ID:1}  # 数据中心ID（0-31），可通过环境变量覆盖
    epoch: 1704067200000                  # 纪元时间（2024-01-01 00:00:00 CST）

# ==================== 智谱AI配置 ====================
zhipuai:
  # API密钥（从 https://open.bigmodel.cn/usercenter/apikeys 获取）
  api-key: 03221a26791e408c8b90fc60153b21c8.cQtSYhnFrFEoT27u
  # 模型选择（正确的模型名称）
  # glm-4-flash: 标准Flash版本，免费，速度快，并发限制中等（推荐）
  # glm-4-air: 轻量级版本，免费，更低的并发限制
  # glm-4: 标准版，需要付费，能力强
  # glm-4-plus: 增强版，需要付费，能力最强
  model: ${ZHIPU_MODEL:glm-4-flash}
  # API地址
  base-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  # 超时时间（毫秒）
  timeout: 30000

