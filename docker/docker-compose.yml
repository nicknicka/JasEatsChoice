version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: jaseats-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /data/uploads:/data/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      spring-boot:
        condition: service_healthy
    networks:
      - jaseats-net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  spring-boot:
    build:
      context: ../JasEatsChoiceJava
      dockerfile: Dockerfile
    container_name: jaseats-app
    expose:
      - "7777"
      - "11277"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=7777
      - DB_URL=jdbc:mysql://mysql:3306/jia_shi_yi_xuan?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FILE_UPLOAD_PATH=/data/uploads/
      - FILE_SERVER_URL=https://api.yourdomain.com/api
      - NETTY_PORT=11277
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - /data/uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jaseats-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  mysql:
    image: mysql:8.0
    container_name: jaseats-mysql
    expose:
      - "3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=jia_shi_yi_xuan
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-backup:/backup
    networks:
      - jaseats-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: jaseats-redis
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - jaseats-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # SSL 证书自动续期
  certbot:
    image: certbot/certbot
    container_name: jaseats-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - jaseats-net
    restart: always

networks:
  jaseats-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nginx-logs:
