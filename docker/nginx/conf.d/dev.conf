# 开发环境配置 - 端口 80, 无 SSL
server {
    listen 80;
    server_name localhost;

    # 开发环境日志（debug 级别便于排查）
    access_log /var/log/nginx/dev-access.log main;
    error_log /var/log/nginx/dev-error.log debug;

    # --- SSE 端点（必须在通用 /api/ 之前，优先匹配） ---
    location /api/agent/supervisor-sse/ {
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_pass http://spring_boot;

        # SSE 关键：禁用所有缓冲
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # 分块传输编码
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # 超时对齐后端 SSE_TIMEOUT_MS（300秒）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }

    # --- 文件上传路径（开发环境代理到 Spring Boot） ---
    location /api/uploads/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spring_boot;
    }

    location /api/files/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spring_boot;
    }

    # --- 通用 API 代理 -> Spring Boot 7777 ---
    location /api/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spring_boot;
    }

    # --- WebSocket 代理 -> Netty 11277 ---
    location /ws/chat {
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_pass http://netty_ws;

        # WebSocket 升级头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 长连接超时（1小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_pass http://netty_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- 健康检查端点 ---
    location /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # --- 开发信息端点 ---
    location /nginx-info {
        access_log off;
        default_type text/plain;
        return 200 'JasEatsChoice Dev Proxy\nSpring Boot: spring-boot:7777\nNetty WS: spring-boot:11277\n';
    }

    # 拒绝其他请求
    location / {
        return 404 '{"success":false,"message":"Not found. Use /api/ or /ws/ paths."}';
        add_header Content-Type application/json;
    }
}
