# 生产环境配置 - 端口 80 + 443 SSL
# 域名: api.yourdomain.com

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name api.yourdomain.com;

    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    # SSL 证书
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    # HSTS（6个月）
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    # 生产环境日志
    access_log /var/log/nginx/prod-access.log main;
    error_log /var/log/nginx/prod-error.log warn;

    # --- 登录/注册端点（更严格限流） ---
    location ~ ^/api/(v1/users/login|v1/users/register|v1/users/send-sms-code|v1/captcha|admin/login) {
        include /etc/nginx/snippets/proxy-params.conf;

        limit_req zone=login_limit burst=10 nodelay;

        proxy_pass http://spring_boot;
    }

    # --- SSE 端点（必须在通用 /api/ 之前） ---
    location /api/agent/supervisor-sse/ {
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_pass http://spring_boot;

        # SSE 关键：禁用所有缓冲
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }

    # --- 静态文件：上传目录（Nginx 直接服务） ---
    location /api/uploads/ {
        alias /data/uploads/;

        # 浏览器缓存 7 天
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        # 防止上传目录中的脚本执行
        location ~* \.(php|jsp|py|sh|cgi)$ {
            deny all;
        }

        sendfile on;
        tcp_nopush on;
    }

    # --- 静态文件：文件访问路径 ---
    location /api/files/ {
        alias /data/uploads/;

        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(php|jsp|py|sh|cgi)$ {
            deny all;
        }

        sendfile on;
        tcp_nopush on;
    }

    # --- 文件上传端点（独立限流） ---
    location ~ ^/api/v1/(upload|chat/upload-image|chat/upload-file|users/[^/]+/avatar) {
        include /etc/nginx/snippets/proxy-params.conf;

        limit_req zone=upload_limit burst=20 nodelay;
        client_max_body_size 220m;

        proxy_pass http://spring_boot;
    }

    # --- Actuator 监控（仅限内网） ---
    location /api/actuator/ {
        include /etc/nginx/snippets/proxy-params.conf;

        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://spring_boot;
    }

    # --- 通用 API 代理 -> Spring Boot ---
    location /api/ {
        include /etc/nginx/snippets/proxy-params.conf;

        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://spring_boot;
    }

    # --- WebSocket 代理 -> Netty ---
    location /ws/chat {
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_pass http://netty_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_pass http://netty_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- 健康检查（用于负载均衡器） ---
    location /health {
        access_log off;
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }

    # 拒绝其他请求
    location / {
        return 444;
    }
}
